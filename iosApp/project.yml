# Proyecto Xcode generado con XcodeGen (https://github.com/yonaskolb/XcodeGen)
# En la Mac:  brew install xcodegen  &&  cd iosApp && xcodegen generate
name: iosApp
options:
  bundleIdPrefix: com.tatanstudios
  deploymentTarget:
    iOS: "16.0"
packages:
  # Notificaciones push (Swift Package Manager). En Android va por Gradle.
  OneSignal:
    url: https://github.com/OneSignal/OneSignal-XCFramework
    from: 5.0.0
settings:
  base:
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: ""   # Poner aquí tu Team ID de Apple
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    dependencies:
      - package: OneSignal
        product: OneSignalFramework
      - package: OneSignal
        product: OneSignalInAppMessages
    # capacidad "Push Notifications" (Xcode cambia a production al exportar para App Store)
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        aps-environment: development
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: El Tuncazo
        # recibir notificaciones en segundo plano
        UIBackgroundModes: [remote-notification]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CADisableMinimumFrameDurationOnPhone: true
        # Sin NSAppTransportSecurity: en Release solo se permite https.
        # En Debug, el script "Permitir http en Debug" (abajo) lo habilita para el servidor local.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tatanstudios.eltuncazo
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ComposeApp"]
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    preBuildScripts:
      - name: Compilar Kotlin (shared)
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Omitiendo Gradle: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          # Xcode no hereda JAVA_HOME: usar el JDK de Android Studio si no hay otro
          if [ -z "$JAVA_HOME" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
            export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          fi
          cd "$SRCROOT/.."
          sh ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # Solo en Debug (botón ▶ de Xcode): permite http para probar contra php artisan serve.
      # Release (Archive para App Store) no pasa por aquí: queda solo https.
      - name: Permitir http en Debug
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then
            exit 0
          fi
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"
          echo "Debug: http permitido (NSAllowsArbitraryLoads) para pruebas locales"
